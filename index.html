<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Superhero Hub • Dashboard Oficial (superheroapi.com)</title>
  <meta name="description" content="Dashboard de superhéroes conectado a https://www.superheroapi.com/ con selector de Modo Día y Noche.">
  <meta name="theme-color" content="#e62429">

  <!-- Favicon Cómic / Superhéroe SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e62429'/><polygon points='50,15 63,40 90,43 70,62 76,89 50,75 24,89 30,62 10,43 37,40' fill='%23ffd700'/></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Estilos Modulares Vanilla CSS -->
  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/mode-dropdown.css">
  <link rel="stylesheet" href="./css/marvel-explorer.css">

  <!-- Script Anti-FOUC para prevenir destello de tema al cargar -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('superhero_theme_preference');
        if (savedTheme) {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body data-theme="light">
  <!-- Accesibilidad: Enlace de salto -->
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <!-- ========================================================================
       ESTRUCTURA PRINCIPAL DE LA APLICACIÓN
       ======================================================================== -->
  <div class="app-layout">
    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Navegación principal">
      <div class="sidebar-header">
        <div class="brand-logo-icon" style="background: var(--superhero-gradient);" aria-hidden="true">⚡</div>
        <div class="brand-info">
          <h2>Superhero Hub</h2>
          <span style="color: var(--marvel-red);">superheroapi.com</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <span class="nav-section-title">Directorio de Héroes</span>
        <a href="#dashboard" class="nav-item active" data-view="dashboard" id="nav-dashboard">
          <span class="nav-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          </span>
          <span>Catálogo de Superhéroes</span>
        </a>

        <span class="nav-section-title">Integración API</span>
        <a href="#superhero-api" class="nav-item" data-view="superhero-api" id="nav-superhero-api">
          <span class="nav-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
          </span>
          <span>Superhero API Client</span>
          <span class="badge badge-success" style="font-size: 0.6rem; margin-left: auto;">API</span>
        </a>

        <span class="nav-section-title">Trunk-Based (TBD)</span>
        <a href="#battle-arena" class="nav-item" data-view="battle-arena" id="nav-battle-arena">
          <span class="nav-icon">⚔️</span>
          <span>Arena de Batalla</span>
          <span id="badge-battle-toggle" class="badge badge-warning" style="font-size: 0.6rem; margin-left: auto;">OFF</span>
        </a>
      </nav>

      <!-- Footer de usuario en el sidebar -->
      <div class="sidebar-footer">
        <img id="sidebar-user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120" alt="Usuario" class="user-avatar-mini">
        <div class="user-mini-meta">
          <div class="user-mini-name">Superhero Explorer</div>
          <div class="user-mini-role">API Client Active</div>
        </div>
      </div>
    </aside>

    <!-- ÁREA DE CONTENIDO Y TOPBAR -->
    <main class="app-main" id="main-content">
      <!-- TOPBAR SUPERIOR -->
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="btn-icon mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menú de navegación">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>

          <!-- Barra de Búsqueda -->
          <div class="search-bar-wrapper">
            <span class="search-icon-pos" aria-hidden="true">
              <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </span>
            <input type="search" id="global-search-input" class="search-input" placeholder="Buscar superhéroes (Spider-Man, Batman, Thor, Hulk...)" aria-label="Buscar en el catálogo">
            <kbd class="search-shortcut-badge">Ctrl K</kbd>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Indicador de API Oficial -->
          <div style="display: flex; align-items: center; gap: 0.4rem; padding: 0.35rem 0.75rem; background: var(--color-danger-bg); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; color: var(--marvel-red);" title="Conectado a https://www.superheroapi.com/">
            <span class="status-dot online" style="background-color: var(--marvel-red);"></span>
            <span>superheroapi.com</span>
          </div>

          <!-- Botón de Control ConfigCat Feature Toggle -->
          <button id="configcat-toggle-btn" class="btn" style="padding: 0.35rem 0.75rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; border: 1px solid var(--color-border); background: var(--color-surface); cursor: pointer;" title="Conmutador de Feature Toggle ConfigCat (Trunk-Based Development)">
            <span>🐱 ConfigCat:</span>
            <span id="configcat-status-badge" class="badge badge-warning" style="font-size: 0.65rem;">Arena OFF</span>
          </button>

          <!-- ==================================================================
               APARTADO DE MODO CON BOTÓN TIPO HAMBURGUESA Y DESPLEGABLE
               "Mode: [símbolo], al presionar hace botón tipo hamburguesa
                donde despliega dark mode y light mode"
               ================================================================== -->
          <div class="mode-selector-wrapper" id="mode-menu-container">
            <button id="mode-menu-trigger" class="mode-hamburger-btn" aria-haspopup="true" aria-expanded="false" aria-label="Cambiar modo de visualización">
              <span class="mode-text-label">Mode:</span>
              <span class="mode-symbol-badge" id="mode-current-icon" title="Modo actual">☀️</span>
              <div class="hamburger-bars" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </button>

            <!-- Menú Desplegable (Dark Mode / Light Mode) -->
            <div class="mode-dropdown-menu" id="mode-dropdown-menu" role="menu">
              <div class="mode-menu-header">Modo Visual</div>

              <button class="mode-menu-item active" data-mode-value="light" role="menuitem">
                <span class="mode-item-icon">☀️</span>
                <div class="mode-item-texts">
                  <span class="mode-item-title">Light Mode</span>
                  <span class="mode-item-desc">Tema claro / día</span>
                </div>
                <span class="mode-item-check" aria-hidden="true">✓</span>
              </button>

              <button class="mode-menu-item" data-mode-value="dark" role="menuitem">
                <span class="mode-item-icon">🌙</span>
                <div class="mode-item-texts">
                  <span class="mode-item-title">Dark Mode</span>
                  <span class="mode-item-desc">Tema oscuro / noche</span>
                </div>
                <span class="mode-item-check" aria-hidden="true">✓</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENEDOR PRINCIPAL DINÁMICO DE VISTAS -->
      <div class="content-body" id="main-view-container">
        <!-- Renderizado dinámicamente por app.js y componentes -->
      </div>
    </main>
  </div>

  <!-- Scripts ES Modules -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
